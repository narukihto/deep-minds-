[package]
name = "base_mev_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# إدارة المهام غير المتزامنة بكامل ميزاتها
tokio = { version = "1", features = ["full"] }

# إصدار Alloy المستقر والحديث لعام 2026 مع تفعيل حزم الـ RPC والـ WebSockets والـ Signers
alloy = { version = "2", features = ["full", "pubsub", "signers"] }

# إدارة الأخطاء المرنة المستخدمة في كود البوت الخاص بك
eyre = "0.6"

# المكتبات الحسابية لعمليات الـ BigUint والـ f64 الخاصة بالمعادلات الابتكارية
num-bigint = "0.4"
num-traits = "0.2"

# معالجة المهام المتوازية الفائقة لتسريع معالجة العقد الحسابية
rayon = "1.10"

# التعامل مع تدفق البيانات والـ Streams القادمة من البلوكشين
futures-util = "0.3"
