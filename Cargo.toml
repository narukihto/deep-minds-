[package]
name = "base_mev_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime with full feature set for HFT environment
tokio = { version = "1", features = ["full"] }

# Alloy v2.5+ configuration ensuring Contract and PubSub/WS engines are explicitly compiled
alloy = { version = "2.5", features = ["full", "pubsub", "signers", "contract", "providers"] }

# Flexible error handling architecture
eyre = "0.6"

# Mathematical frameworks for high-precision BigUint calculations
num-bigint = "0.4"
num-traits = "0.2"

# Ultra-fast parallel computing via rayon data-parallelism library
rayon = "1.10"

# High-performance stream management for processing blockchain events
futures-util = "0.3"
