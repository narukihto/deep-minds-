Name: Deploy and Run Base MEV Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Foundry (Anvil & Cast)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Start Local Anvil Fork in Background
        env:
          ALCHEMY_HTTP_URL: ${{ secrets.ALCHEMY_HTTP_URL }}
        run: |
          echo "[*] Starting local Anvil fork of Base Mainnet..."
          nohup anvil --fork-url "$ALCHEMY_HTTP_URL" --port 8545 > anvil.log 2>&1 &
          echo "[*] Waiting for Anvil RPC to initialize..."
          
          # حلقة تحقق ذكية بديلة لـ nc تضمن جاهزية الـ RPC تماماً
          for i in {1..20}; do
            if curl -s -X POST -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' http://localhost:8545 > /dev/null; then
              echo "[*] Anvil is up and running!"
              break
            fi
            echo "[*] Waiting for Anvil RPC ($i/20)..."
            sleep 2
          done

          # التحقق النهائي وإن لم يعمل يتم طباعة السجلات والخروج
          if ! curl -s -X POST -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' http://localhost:8545 > /dev/null; then
            echo "[!] Anvil failed to start. Logs:"
            cat anvil.log
            exit 1
          fi

      - name: Inspect Execution Trace (Deep Flash Loan Check)
        env:
          CONTRACT_ADDR: ${{ secrets.CONTRACT_ADDR }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          echo "======================================================="
          echo "🔍 [DEEP TRACE] Inspecting EVM Calls & Flash Loan Execution..."
          echo "======================================================="
          
          ACCOUNT_ADDR=$(cast wallet address --private-key "$PRIVATE_KEY")
          USDC_BASE="0x833589fCD6eDb6E08f4c7C32D4f71b54bda02913"
          LOAN_AMOUNT="2000000000"

          cast call "$CONTRACT_ADDR" \
            "triggerBalancerArbitrage(address,uint256,bytes)" \
            "$USDC_BASE" "$LOAN_AMOUNT" "0x" \
            --from "$ACCOUNT_ADDR" \
            --rpc-url "http://127.0.0.1:8545" \
            --trace || true
          
          echo "======================================================="

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Binary (Release)
        run: cargo build --release

      - name: Execute MEV Engine
        env:
          CONTRACT_ADDR: ${{ secrets.CONTRACT_ADDR }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ALCHEMY_HTTP_URL: ${{ secrets.ALCHEMY_HTTP_URL }}
          ALCHEMY_WSS_URL: ${{ secrets.ALCHEMY_WSS_URL }}
          BASE_WSS_RPC: ${{ secrets.ALCHEMY_WSS_URL }}
          ANVIL_RPC_URL: "http://127.0.0.1:8545"
        run: |
          echo "[*] Starting MEV Engine with Local Anvil Simulation..."
          cargo run --release
